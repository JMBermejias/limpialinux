name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build .deb
        run: python3 build_deb.py --version "$VERSION"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-build
          path: dist/limpialinux_*.deb
          if-no-files-found: error

  release:
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-build
          path: deb_assets/

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: LimpiaLinux ${{ env.VERSION }}
          body: |
            Paquete .deb para **Zorin OS** y sistemas basados en **Debian/Ubuntu**.

            Instalación:
            ```
            sudo apt install ./limpialinux_${{ env.VERSION }}_all.deb
            ```
          files: |
            deb_assets/limpialinux_*.deb
            LICENSE
          generate_release_notes: true
          prerelease: false